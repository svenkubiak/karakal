# Application configuration
#
# Values in the active environment overwrite default values.
#
# dev and test use the literal application secret below. prod is the Docker
# installation: every secret is file{} and is read from a file named like the
# configuration key. The directory is /run/secrets, unless APPLICATION_SECRETS_PATH
# is set. install.sh creates those files and does not write a second config.yaml.
#
# karakal.url reads KARAKAL_URL and falls back to http://localhost.
# connector.http.port reads CONNECTOR_HTTP_PORT and falls back to 9090.
# persistence.mongo.host reads PERSISTENCE_MONGO_HOST and has no fallback.
# persistence.mongo.username reads PERSISTENCE_MONGO_USERNAME and falls back to karakal.

default:
  application:
    name: karakal
    language: en
    secret: tFS1nW3i8eAVTpFgo4CLsrXIwgf4eIPBp36HeW4LpYfoTorx79qsqiDpCMFYx83m
  connector:
    http:
      host: 0.0.0.0
      port: 9090
  karakal:
    url: https://karakal.local.kubiak.me
  session:
    cookie:
      name: karakal-session
      secure: false
  authentication:
    cookie:
      name: karakal-authentication
      secure: false
  flash:
    cookie:
      name: karakal-flash
      secure: false
  i18n:
    cookie:
      name: karakal-i18n
  smtp:
    host: localhost
    port: 25
  persistence:
    mongo:
      package: models

environments:
  dev:
    connector:
      http:
        host: 192.168.1.224
        port: 9090
    persistence:
      mongo:
        embedded: false
        host: localhost
        port: 31031
        dbname: karakal

  test:
    connector:
      http:
        host: 127.0.0.1
        port: 9823
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019

  prod:
    application:
      name: Karakal
      secret: file{}
      parameter:
        strict: true
    connector:
      http:
        host: 0.0.0.0
        port: env{9090}
    karakal:
      url: env{http://localhost}
    session:
      cookie:
        name: __Host-karakal-session
        secret: file{}
        key: file{}
        secure: true
    authentication:
      redirect:
        login: /auth/login
        mfa: /auth/mfa
      cookie:
        name: __Host-karakal-authentication
        secret: file{}
        key: file{}
        secure: true
    flash:
      cookie:
        name: __Host-karakal-flash
        secret: file{}
        key: file{}
        secure: true
    i18n:
      cookie:
        name: __Host-karakal-i18n
    persistence:
      mongo:
        embedded: false
        host: env{}
        port: 27017
        dbname: karakal
        username: env{karakal}
        password: file{}
        authdb: env{admin}
        auth: true
