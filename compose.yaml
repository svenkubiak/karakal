services:
  karakal-web:
    image: ghcr.io/svenkubiak/karakal/karakal:${VERSION}
    container_name: karakal-web
    restart: always
    env_file:
      - .env
    environment:
      # The configuration file is set by the image itself and is intentionally not part of JAVA_OPTS
      JAVA_OPTS: >
        -Xms512m
        -Xmx512m
        -XX:+UseCompactObjectHeaders
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    depends_on:
      karakal-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - karakal-network

  karakal-database:
    image: mongodb/mongodb-community-server:8.2.2-ubuntu2204
    container_name: karakal-database
    restart: always
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${MONGODB_INITDB_ROOT_USERNAME}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGODB_INITDB_ROOT_PASSWORD}
      - MONGODB_INITDB_DATABASE=${MONGODB_INITDB_DATABASE}
      - GLIBC_TUNABLES=glibc.pthread.rseq=0
    security_opt:
      - no-new-privileges:true
    volumes:
      - karakal_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - karakal-network

networks:
  karakal-network:
    driver: bridge

volumes:
  karakal_mongodb_data: